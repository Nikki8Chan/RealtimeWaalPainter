
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Room Wall Color Changer</title>

    <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #ccc; }
       
        /* Video feed styling */
        video, canvas {

            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;

        }

        /* Control panel */
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Display selected color */

        .color-display {
            width: 80px;
            height: 30px;
            border-radius: 5px;
            margin-bottom: 10px;
            line-height: 30px;
            text-align: center;
            font-weight: bold;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

<!-- Video feed -->
<video id="video" autoplay playsinline></video>
<canvas id="outputCanvas"></canvas>


<!-- Color Picker Controls -->
<div class="controls">
    <div class="color-display" id="hexDisplay">#ffffff</div>
    <div id="colorPicker"></div>
</div>

<script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("outputCanvas");
    const ctx = canvas.getContext("2d");

    // Initialize color picker

    var colorPicker = new iro.ColorPicker("#colorPicker", {
        width: 200,
        color: "#ffffff",
        layout: [
            { component: iro.ui.Wheel },
            { component: iro.ui.Slider, options: { sliderType: 'hue' } },
            { component: iro.ui.Slider, options: { sliderType: 'saturation' } },
            { component: iro.ui.Slider, options: { sliderType: 'value' } }
        ]
    });

    let selectedColor = "#ffffff";

    colorPicker.on("color:change", function(color) {
        selectedColor = color.hexString;

        document.getElementById("hexDisplay").innerText = color.hexString;
        document.getElementById("hexDisplay").style.backgroundColor = color.hexString;
    });

    async function startCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
    }

    async function detectWalls() {
        const segmentation = new SelfieSegmentation({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}` });
        segmentation.setOptions({ modelSelection: 1 });
        segmentation.onResults(processResults);
       
        await segmentation.initialize();
       
        async function processFrame() {
            await segmentation.send({ image: video });
            requestAnimationFrame(processFrame);
        }
        processFrame();
    }

    function processResults(results) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
       
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const pixels = imageData.data;
        for (let i = 0; i < pixels.length; i += 4) {
            if (results.segmentationMask.data[i / 4] > 0.5) { // Wall detected
                pixels[i] = parseInt(selectedColor.slice(1, 3), 16);   // Red
                pixels[i + 1] = parseInt(selectedColor.slice(3, 5), 16); // Green
                pixels[i + 2] = parseInt(selectedColor.slice(5, 7), 16); // Blue
            }
        }
        ctx.putImageData(imageData, 0, 0);
    }

    startCamera().then(detectWalls);
</script>

</body>
</html>
